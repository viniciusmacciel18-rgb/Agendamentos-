<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Agendamento confirmado | Rayssa Lima</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="confirmation-page">

    <main class="confirmation-card">

        <div class="confirmation-logo">
            <img src="{{ url_for('static', filename='logo.png') }}"
                 alt="Rayssa Lima Nail Designer">
        </div>

        <div class="confirmation-check">
            ✓
        </div>

        <h1>Agendamento confirmado!</h1>

        <p class="confirmation-client">
            Olá, <strong>{{ name }}</strong>!
        </p>

        <p class="confirmation-text">
            Seu horário foi reservado com sucesso.<br>
            Confira os detalhes do seu atendimento:
        </p>

        <div class="confirmation-details">

            <div class="confirmation-detail">
                <span class="detail-icon">✂</span>
                <span class="detail-label">SERVIÇO</span>
                <strong>{{ service }}</strong>
            </div>

            <div class="confirmation-detail">
                <span class="detail-icon">▣</span>
                <span class="detail-label">DATA</span>
                <strong>{{ day }}</strong>
            </div>

            <div class="confirmation-detail">
                <span class="detail-icon">◷</span>
                <span class="detail-label">HORÁRIO</span>
                <strong>{{ time }}</strong>
            </div>

        </div>

        <a class="confirmation-button"
           href="{{ url_for('index') }}">
            Fazer outro agendamento
            <span>→</span>
        </a>

        <div class="confirmation-footer">
            ♡
            <p>CUIDAR DE VOCÊ É A NOSSA ESPECIALIDADE</p>
        </div>

    </main>

</body>
</html>
