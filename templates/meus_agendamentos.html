<!doctype html>

<html lang="pt-BR">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="theme-color"
        content="#8f5f67"
    >

    <meta
        name="description"
        content="Consulte seus agendamentos | Rayssa Lima Nail Designer"
    >

    <title>
        Meus agendamentos | Rayssa Lima Nail Designer
    </title>


    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


    <!-- DECORAÇÃO -->

    <div class="decor decor-top"></div>

    <div class="decor decor-bottom"></div>


    <!-- CARD -->

    <main class="card booking-card">


        <!-- LOGO -->

        <div class="logo">

            <img
                src="{{ url_for('static', filename='logo.png') }}"
                alt="Rayssa Lima Nail Designer"
            >

        </div>


        <!-- DIVISOR -->

        <div class="brand-divider">

            <span></span>

            <b>♡</b>

            <span></span>

        </div>


        <!-- TÍTULO -->

        <h1>
            Meus agendamentos
        </h1>


        <p class="sub">
            Consulte seus horários de forma rápida e segura.
        </p>


        <!-- ÁREA DE CONSULTA -->

        <div class="my-appointments-page">


            <!-- AVISO -->

            <div class="welcome">

                <span class="welcome-icon">
                    ✦
                </span>


                <div>

                    <strong>
                        Consulte seu agendamento
                    </strong>

                    <small>
                        Informe o WhatsApp utilizado na reserva.
                    </small>

                </div>

            </div>


            <!-- CAMPO WHATSAPP -->

            <div class="field">

                <label for="appointmentPhone">

                    WhatsApp

                    <span>*</span>

                </label>


                <div class="input-wrap">

                    <span class="field-icon">
                        ◉
                    </span>


                    <input
                        id="appointmentPhone"
                        type="tel"
                        placeholder="(47) 99999-9999"
                        autocomplete="tel"
                    >

                </div>

            </div>


            <!-- BOTÃO BUSCAR -->

            <button
                type="button"
                class="booking-button"
                onclick="buscarAgendamentos()"
            >

                <span>
                    Buscar meus agendamentos
                </span>

                <strong>
                    →
                </strong>

            </button>


            <!-- RESULTADO -->

            <div id="appointmentsResult"></div>


            <!-- VOLTAR -->

            <a
                href="{{ url_for('index') }}"
                class="back-button"
            >
                ← Voltar para agendamento
            </a>


        </div>


        <!-- DIVISOR -->

        <div class="footer-divider">

            <span></span>

            <b>♡</b>

            <span></span>

        </div>


        <!-- RODAPÉ -->

        <footer>

            <strong>
                Rayssa Lima
            </strong>

            <span>
                NAIL DESIGNER
            </span>

            <small>
                Atendimento com carinho e cuidado.
            </small>

        </footer>


    </main>


    <!-- JAVASCRIPT -->

    <script>


        async function buscarAgendamentos() {


            /* Campo do telefone */

            const phoneInput =
                document.getElementById(
                    "appointmentPhone"
                );


            /* Área onde aparecerá o resultado */

            const result =
                document.getElementById(
                    "appointmentsResult"
                );


            /* Remove espaços */

            const phone =
                phoneInput.value.trim();


            /* Verifica se digitou o telefone */

            if (!phone) {

                result.innerHTML = `

                    <div class="alert error">

                        Digite seu número de WhatsApp.

                    </div>

                `;

                phoneInput.focus();

                return;

            }


            /* Mensagem enquanto procura */

            result.innerHTML = `

                <div class="appointment-loading">

                    Consultando seus agendamentos...

                </div>

            `;


            try {


                /*

                    Envia o telefone para o Flask.

                    Exemplo:

                    /api/meus-agendamentos?phone=479977221504

                */

                const response = await fetch(

                    `/api/meus-agendamentos?phone=${encodeURIComponent(phone)}`

                );


                /* Verifica resposta do servidor */

                if (!response.ok) {

                    throw new Error(
                        "Erro ao consultar agendamentos."
                    );

                }


                /* Converte resposta para JSON */

                const data =
                    await response.json();


                /*

                    Se não encontrou agendamentos.

                */

                if (
                    !data.success ||
                    !data.appointments ||
                    !data.appointments.length
                ) {

                    result.innerHTML = `

                        <div class="appointment-empty">

                            <strong>
                                Nenhum agendamento encontrado
                            </strong>

                            <p>
                                Verifique se o WhatsApp informado
                                é o mesmo utilizado na reserva.
                            </p>

                        </div>

                    `;

                    return;

                }


                /*

                    Cria a lista de agendamentos.

                */

                let html = `

                    <div class="appointments-list">

                        <h2>
                            Seus agendamentos
                        </h2>

                `;


                /* Percorre os agendamentos */

                data.appointments.forEach(
                    function(appointment) {


                        /*

                            Formata a data.

                        */

                        const dataFormatada =
                            formatarData(
                                appointment.date
                            );


                        /*

                            Mostra o status.

                        */

                        const status =
                            appointment.status ||
                            "Confirmado";


                        html += `

                            <div class="appointment-card">

                                <div class="appointment-info">


                                    <strong>
                                        ${escapeHtml(
                                            appointment.service
                                        )}
                                    </strong>


                                    <span>

                                        📅

                                        ${dataFormatada}

                                    </span>


                                    <span>

                                        🕐

                                        ${escapeHtml(
                                            appointment.time
                                        )}

                                    </span>


                                    <span class="status-confirmado">

                                        ${escapeHtml(
                                            status
                                        )}

                                    </span>


                                </div>

                            </div>

                        `;

                    }
                );


                html += `

                    </div>

                `;


                /* Mostra os resultados */

                result.innerHTML = html;


            } catch (error) {


                console.error(error);


                result.innerHTML = `

                    <div class="alert error">

                        Não foi possível consultar
                        seus agendamentos.

                    </div>

                `;

            }

        }


        /*

            Converte:

            2026-09-16

            para:

            16/09/2026

        */

        function formatarData(data) {


            if (!data) {

                return "";

            }


            const partes =
                data.split("-");


            if (partes.length !== 3) {

                return data;

            }


            return (

                partes[2] +
                "/" +
                partes[1] +
                "/" +
                partes[0]

            );

        }


        /*

            Proteção simples para que dados
            vindos do banco não sejam
            interpretados como HTML.

        */

        function escapeHtml(text) {


            if (text === null ||
                text === undefined) {

                return "";

            }


            return String(text)

                .replace(/&/g, "&amp;")

                .replace(/</g, "&lt;")

                .replace(/>/g, "&gt;")

                .replace(/"/g, "&quot;")

                .replace(/'/g, "&#039;");

        }


        /*

            Permite apertar ENTER
            dentro do campo WhatsApp
            para fazer a busca.

        */

        document
            .getElementById("appointmentPhone")
            .addEventListener(
                "keydown",
                function(event) {

                    if (event.key === "Enter") {

                        event.preventDefault();

                        buscarAgendamentos();

                    }

                }
            );


    </script>


</body>

</html>
