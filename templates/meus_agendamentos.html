<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meus agendamentos | Rayssa Lima Nail Designer</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff8fb 0%,
                    #fdf1f6 50%,
                    #f8eaf1 100%
                );

            color: #3b3035;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 16px;
        }

        .page {
            width: 100%;
            max-width: 520px;
        }

        /* ==================================================
           LOGO
           ================================================== */

        .logo-area {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-area img {
            width: 105px;
            height: 105px;

            object-fit: contain;

            border-radius: 50%;

            background: #ffffff;

            padding: 7px;

            box-shadow:
                0 10px 30px rgba(80, 50, 65, 0.12);
        }

        .brand-name {
            margin-top: 12px;

            font-size: 14px;

            font-weight: 600;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            color: #80606e;
        }

        /* ==================================================
           CARD PRINCIPAL
           ================================================== */

        .card {
            background: rgba(255, 255, 255, 0.96);

            border-radius: 24px;

            padding: 34px 28px;

            box-shadow:
                0 20px 60px rgba(70, 40, 55, 0.12);

            border: 1px solid rgba(150, 110, 130, 0.12);
        }

        .title {
            text-align: center;

            font-size: 28px;

            font-weight: 700;

            color: #49363f;

            margin-bottom: 9px;
        }

        .subtitle {
            text-align: center;

            font-size: 14px;

            line-height: 1.6;

            color: #8a737d;

            margin-bottom: 28px;
        }

        /* ==================================================
           FORMULÁRIO
           ================================================== */

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;

            margin-bottom: 8px;

            font-size: 13px;

            font-weight: 600;

            color: #5d4852;
        }

        .field input {
            width: 100%;

            height: 52px;

            border: 1px solid #eadce3;

            border-radius: 13px;

            padding: 0 15px;

            font-size: 15px;

            color: #45353c;

            background: #fffafd;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s,
                background 0.2s;
        }

        .field input:focus {
            border-color: #c792aa;

            background: #ffffff;

            box-shadow:
                0 0 0 4px rgba(199, 146, 170, 0.12);
        }

        .field input::placeholder {
            color: #b3a2aa;
        }

        /* ==================================================
           BOTÃO
           ================================================== */

        .search-button {
            width: 100%;

            height: 53px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #a96f89,
                    #87566f
                );

            color: #ffffff;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 10px 22px rgba(135, 86, 111, 0.22);

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                opacity 0.2s;
        }

        .search-button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 13px 26px rgba(135, 86, 111, 0.28);
        }

        .search-button:active {
            transform: translateY(0);
        }

        .search-button:disabled {
            opacity: 0.65;

            cursor: wait;

            transform: none;
        }

        /* ==================================================
           RESULTADOS
           ================================================== */

        #appointmentsResult {
            margin-top: 25px;
        }

        .appointments-info {
            background: #fff8fb;

            border: 1px solid #eedee6;

            border-radius: 15px;

            padding: 16px;

            margin-bottom: 12px;

            color: #705963;

            font-size: 14px;

            line-height: 1.6;
        }

        .appointment-card {
            background: #ffffff;

            border: 1px solid #eadde4;

            border-radius: 17px;

            padding: 18px;

            margin-bottom: 12px;

            box-shadow:
                0 7px 20px rgba(70, 40, 55, 0.06);
        }

        .appointment-service {
            font-size: 17px;

            font-weight: 700;

            color: #513d47;

            margin-bottom: 12px;
        }

        .appointment-row {
            display: flex;

            align-items: center;

            gap: 9px;

            font-size: 14px;

            color: #76636c;

            margin-top: 7px;
        }

        .appointment-row strong {
            color: #55424b;
        }

        .status {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            margin-top: 14px;

            padding: 6px 11px;

            border-radius: 30px;

            background: #edf8f1;

            color: #427052;

            font-size: 12px;

            font-weight: 700;
        }

        .status.cancelado {
            background: #f8eeee;

            color: #9a5d5d;
        }

        /* ==================================================
           AVISO
           ================================================== */

        .notice {
            margin-top: 22px;

            padding: 15px;

            border-radius: 14px;

            background: #faf5f7;

            border: 1px solid #eee0e6;

            color: #806c75;

            font-size: 12px;

            line-height: 1.6;

            text-align: center;
        }

        /* ==================================================
           VOLTAR
           ================================================== */

        .back-link {
            display: block;

            text-align: center;

            margin-top: 23px;

            color: #93647b;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* ==================================================
           MOBILE
           ================================================== */

        @media (max-width: 480px) {

            body {
                padding: 20px 12px;
            }

            .card {
                padding: 28px 20px;

                border-radius: 21px;
            }

            .title {
                font-size: 25px;
            }

            .logo-area img {
                width: 90px;
                height: 90px;
            }
        }

    </style>
</head>


<body>

    <main class="page">

        <!-- ==================================================
             LOGO
             ================================================== -->

        <div class="logo-area">

            <img
                src="{{ url_for('static', filename='logo.png') }}"
                alt="Rayssa Lima Nail Designer"
            >

            <div class="brand-name">
                Rayssa Lima Nail Designer
            </div>

        </div>


        <!-- ==================================================
             CARD
             ================================================== -->

        <section class="card">

            <h1 class="title">
                Meus agendamentos
            </h1>

            <p class="subtitle">
                Consulte seus horários utilizando o número
                de WhatsApp informado no momento do agendamento.
            </p>


            <!-- ==================================================
                 CAMPO WHATSAPP
                 ================================================== -->

            <div class="field">

                <label for="appointmentPhone">
                    WhatsApp
                </label>

                <input
                    type="tel"
                    id="appointmentPhone"
                    placeholder="Digite seu número de WhatsApp"
                    autocomplete="tel"
                >

            </div>


            <!-- ==================================================
                 BOTÃO
                 ================================================== -->

            <button
                type="button"
                id="searchAppointments"
                class="search-button"
            >
                Buscar meus agendamentos →
            </button>


            <!-- ==================================================
                 RESULTADOS
                 ================================================== -->

            <div id="appointmentsResult"></div>


            <!-- ==================================================
                 AVISO
                 ================================================== -->

            <div class="notice">

                Para cancelar ou alterar seu agendamento,
                entre em contato diretamente com a Rayssa
                pelo WhatsApp.

            </div>


            <!-- ==================================================
                 VOLTAR
                 ================================================== -->

            <a
                href="{{ url_for('index') }}"
                class="back-link"
            >
                ← Voltar para o agendamento
            </a>

        </section>

    </main>


    <!-- ======================================================
         JAVASCRIPT
         ====================================================== -->

    <script>

        const button =
            document.getElementById(
                "searchAppointments"
            );

        const phoneInput =
            document.getElementById(
                "appointmentPhone"
            );

        const result =
            document.getElementById(
                "appointmentsResult"
            );


        // =====================================================
        // BUSCAR AGENDAMENTOS
        // =====================================================

        async function buscarAgendamentos() {

            const phone =
                phoneInput.value.trim();


            // Verifica se informou o WhatsApp
            if (!phone) {

                result.innerHTML = `
                    <div class="appointments-info">
                        Informe o número de WhatsApp
                        utilizado no agendamento.
                    </div>
                `;

                phoneInput.focus();

                return;
            }


            // Estado do botão
            button.disabled = true;

            button.innerText =
                "Consultando...";


            // Limpa resultado anterior
            result.innerHTML = "";


            try {

                const response =
                    await fetch(
                        `/api/meus-agendamentos?phone=${encodeURIComponent(phone)}`
                    );


                const data =
                    await response.json();


                // Se o servidor retornou erro
                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Não foi possível consultar os agendamentos."
                    );

                }


                /*
                 * IMPORTANTE:
                 *
                 * O app.py retorna:
                 *
                 * {
                 *     success: true,
                 *     appointments: [...]
                 * }
                 *
                 * Por isso usamos data.appointments.
                 */

                const appointments =
                    Array.isArray(data)
                        ? data
                        : (
                            Array.isArray(
                                data.appointments
                            )
                                ? data.appointments
                                : []
                        );


                // =================================================
                // NENHUM AGENDAMENTO
                // =================================================

                if (
                    appointments.length === 0
                ) {

                    result.innerHTML = `
                        <div class="appointments-info">
                            Nenhum agendamento encontrado
                            para este WhatsApp.
                        </div>
                    `;

                    return;
                }


                // =================================================
                // MOSTRA OS AGENDAMENTOS
                // =================================================

                result.innerHTML =
                    appointments.map(
                        item => {

                            const status =
                                item.status ||
                                "Confirmado";


                            const statusClass =
                                status === "Cancelado"
                                    ? "cancelado"
                                    : "";


                            return `

                                <div class="appointment-card">

                                    <div class="appointment-service">
                                        ${escapeHtml(
                                            item.service ||
                                            "Serviço"
                                        )}
                                    </div>


                                    <div class="appointment-row">

                                        <span>📅</span>

                                        <span>
                                            <strong>Data:</strong>
                                            ${formatDate(
                                                item.date
                                            )}
                                        </span>

                                    </div>


                                    <div class="appointment-row">

                                        <span>🕐</span>

                                        <span>
                                            <strong>Horário:</strong>
                                            ${escapeHtml(
                                                item.time ||
                                                ""
                                            )}
                                        </span>

                                    </div>


                                    <div class="
                                        status
                                        ${statusClass}
                                    ">

                                        ${escapeHtml(
                                            status
                                        )}

                                    </div>

                                </div>

                            `;

                        }
                    ).join("");

            }


            catch (error) {

                console.error(
                    "Erro ao consultar agendamentos:",
                    error
                );


                result.innerHTML = `

                    <div class="appointments-info">

                        Não foi possível consultar
                        seus agendamentos.

                        <br><br>

                        Verifique o número de WhatsApp
                        e tente novamente.

                    </div>

                `;

            }


            finally {

                button.disabled = false;

                button.innerText =
                    "Buscar meus agendamentos →";

            }

        }


        // =====================================================
        // FORMATAR DATA
        // =====================================================

        function formatDate(dateString) {

            if (!dateString) {
                return "";
            }


            const parts =
                dateString.split("-");


            if (parts.length !== 3) {
                return dateString;
            }


            return (
                parts[2] +
                "/" +
                parts[1] +
                "/" +
                parts[0]
            );

        }


        // =====================================================
        // PROTEGER TEXTO EXIBIDO NA PÁGINA
        // =====================================================

        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        // =====================================================
        // CLIQUE NO BOTÃO
        // =====================================================

        button.addEventListener(
            "click",
            buscarAgendamentos
        );


        // =====================================================
        // ENTER NO CAMPO
        // =====================================================

        phoneInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    event.preventDefault();

                    buscarAgendamentos();

                }

            }
        );

    </script>

</body>

</html>
